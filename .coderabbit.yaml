# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  path_instructions:
    - path: "**/*.cs"
      instructions: |
        Spesh Base supports only Jellyfin. The backend targets net8.0 and the Jellyfin 10.10 API baseline. Guard APIs that require newer hosts.
        Feature code under shared is compiled into the Jellyfin projects. Preserve configuration XML compatibility and existing client JSON fields and routes.
        Synced settings are nullable; null means unset. Do not introduce dictionaries into XML configuration models.
    - path: "**/Pages/**"
      instructions: |
        Admin defaults use three-state selects for nullable booleans. Load and save every field together because configuration updates replace the whole object.
        Jellyfin uses emby-prefixed web components. These names are Jellyfin dependencies and must remain intact.
    - path: "**/Web/loader.js"
      instructions: |
        This loader runs alongside other plugins in Jellyfin Web. Preserve the host's toolbar insertion points and avoid interfering with other plugins.
